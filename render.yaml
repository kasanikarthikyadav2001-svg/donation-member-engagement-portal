services:
  - type: web
    name: donation-member-engagement-portal
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node backend/dist/cloud.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: dmep
      - key: ADMIN_NAME
        value: Kartheek
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOW_SANDBOX_PAYMENTS
        value: "false"
      - key: TRUST_PROXY
        value: "1"
      - key: LOG_LEVEL
        value: info
